name: repro-invariant

on:
  workflow_dispatch:
  push:
    branches: [master]

defaults:
  run:
    shell: bash
    working-directory: .

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.70.0
  SOLANA_VERSION: "1.16.27"

jobs:
  repro:
    name: repro share-invariant DoS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - uses: ./.github/actions/setup-solana/

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-0.29.0

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.29.0 anchor-cli --locked

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup yarn
        run: npm install -g yarn

      - name: Install deps
        run: yarn

      - name: install typescript (pin to repo version)
        run: npm install typescript@5.6.3 -g

      - name: build sdk
        run: |
          yarn
          ../../../ts/sdk/node_modules/.bin/tsc 2>/dev/null || tsc
        working-directory: ts/sdk

      - name: use upstream registries (repo ships a vendored-source config)
        run: rm -f .cargo/config.toml && ls -la .cargo/ 2>/dev/null || echo ".cargo removed"

      - name: build program (sbf)
        run: |
          set -o pipefail
          anchor build -- --features anchor-test 2>&1 | tee /tmp/build.log
          echo "=== ANCHOR BUILD EXIT: ${PIPESTATUS[0]} ==="
          ls -la target/deploy/

      - name: run repro test (bankrun)
        env:
          RUST_LOG: solana_runtime::message_processor::stable_log=info
        run: |
          set -o pipefail
          # bankrun loads <dir>/<name>.so — drift + pyth ship as fixtures, the
          # vault program was just built into target/deploy. One dir for all three.
          cp -v target/deploy/drift_vaults.so tests/fixtures/drift_vaults.so
          ls -la tests/fixtures/
          npx jest tests/reproInvariant.test.ts --runInBand --forceExit 2>&1 | tee /tmp/repro.log
          echo "=== JEST EXIT: ${PIPESTATUS[0]} ==="

      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-log
          path: |
            /tmp/repro.log
            /tmp/build.log
